

name: Blood Pressure Calculator CI

env:
  AZURE_WEBAPP_NAME: bp-calculator-jomzi
  AZURE_WEBAPP_PACKAGE_PATH: './publish'

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          # Fetch full repository history for SonarQube
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Install SonarScanner for .NET
      - name: Install SonarScanner
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Begin SonarQube Cloud analysis
      - name: Begin SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"Jomzi_blood-pressure-category-calculator" \
            /o:"Jomzi" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io"

      - name: Restore dependencies
        run: dotnet restore BPCalculator.sln

      - name: Build application
        run: dotnet build BPCalculator.sln --configuration Release --no-restore  --no-incremental

      # Run automated unit tests before publishing
      - name: Run unit tests
        run: dotnet test BPCalculator.UnitTests/BPCalculator.UnitTests.csproj --configuration Release --no-build

      # Complete SonarQube Cloud analysis
      - name: End SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      # Publish the Blood Pressure Calculator application
      # This creates the files needed to deploy the application to Azure
      - name: Publish application
        run: dotnet publish BPCalculator/BPCalculator.csproj --configuration Release --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} --no-build

      # Deploy the published application to our Azure Web App
      - name: Deploy to Azure Web App
        # Prevent deployment during pull requests
        if: github.event_name == 'push'
        uses: azure/webapps-deploy@v2
        with:
          # Identifies the Azure Web App we want to deploy to
          app-name: ${{ env.AZURE_WEBAPP_NAME }}

          # Uses the publish profile stored securely in GitHub repository secrets
          # This allows GitHub Actions to authenticate with Azure
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

          # Tells Azure where to find the published application files
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}


